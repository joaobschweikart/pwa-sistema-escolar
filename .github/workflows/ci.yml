# Integração contínua: lint, análise estática, testes, build do front-end e da imagem
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  php:
    name: Pint, Larastan e Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_mysql, intl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('app/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Pint (estilo)
        run: vendor/bin/pint --test

      - name: Larastan (nível 7)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest (unit, feature e arquitetura)
        run: vendor/bin/pest --parallel

  frontend:
    name: Build Vite + PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Service worker e manifest gerados
        run: test -f public/build/sw.js && test -f public/build/manifest.webmanifest

  docker:
    name: Build da imagem dem-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: false
          tags: dem-app:ci
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E Playwright (offline + mobile)
    runs-on: ubuntu-latest
    needs: [php, frontend]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o ambiente local (um comando)
        # containers rodam com o UID do runner (dono do checkout)
        run: DEM_UID=$(id -u) DEM_GID=$(id -g) docker compose up -d --build --wait --wait-timeout 600
      - name: Healthcheck
        run: curl -fsS http://localhost:8080/api/health
      - name: Playwright (imagem oficial)
        working-directory: app
        run: npm run e2e:docker
        env:
          CI: 'true'
      - name: Relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/tests/e2e/test-results
      - name: Logs
        if: failure()
        run: docker compose logs --no-color | tail -n 300
