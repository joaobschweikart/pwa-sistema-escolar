; Pool php-fpm do DEM — processos limitados para caber em 2 GB junto com o MySQL
[www]
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
ping.path = /ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
