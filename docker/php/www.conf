; Pool php-fpm do DEM — econômico em memória (a instância é compartilhada).
; "ondemand": nenhum processo ocioso; sobe até 5 processos sob carga e os
; encerra após 20 s sem requisições. Cada processo usa ~25–40 MB.
[www]
listen = 9000
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 20s
pm.max_requests = 300
ping.path = /ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
