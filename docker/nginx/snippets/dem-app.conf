# Bloco comum: arquivos estáticos servidos pelo nginx e PHP via FastCGI (php-fpm:9000)
root /var/www/html/public;
index index.php;
charset utf-8;
client_max_body_size 10m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

# Service worker: nunca em cache HTTP e com escopo liberado para a raiz do site
location = /build/sw.js {
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location = /build/manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Assets do Vite têm hash no nome: cache longo e imutável
location /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

location ~ ^/index\.php(/|$) {
    fastcgi_pass php-fpm:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}

location ~ /\.(?!well-known).* { deny all; }
location ~ \.php$ { return 404; }
