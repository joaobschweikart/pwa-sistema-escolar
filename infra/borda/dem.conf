# =============================================================================
# Borda compartilhada: diario.obramestra.com.br -> DEM (Diário Escolar Municipal)
#
# O DEM é um projeto separado que roda na mesma instância. Este vhost termina o
# TLS e encaminha para o container "dem-nginx" pela rede Docker externa
# "dem_borda". O upstream é uma variável resolvida pelo resolver do Docker
# (00-global.conf): se o DEM estiver fora do ar, só este host responde 502 e o
# nginx continua subindo normalmente para os demais sites.
# =============================================================================
server {
    listen 80;
    server_name diario.obramestra.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name diario.obramestra.com.br;

    ssl_certificate     /etc/letsencrypt/live/diario.obramestra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diario.obramestra.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        set $dem_upstream http://dem-nginx:80;
        proxy_pass $dem_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 90s;
    }
}
